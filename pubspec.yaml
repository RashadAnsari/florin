name: florin
description: "Free, offline bookkeeping for Dutch freelancers (ZZP)."
publish_to: 'none'
version: 1.5.0

environment:
  sdk: ^3.11.0
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.4
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  pdf: ^3.10.8
  file_picker: ^8.1.0
  window_manager: ^0.3.9
  intl: ^0.20.2
  csv: ^6.0.0
  shared_preferences: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.4
  crypto: ^3.0.8
  url_launcher: ^6.3.3
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
