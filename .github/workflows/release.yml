name: Release

on:
  push:
    branches: [master]
    paths: [pubspec.yaml]

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # pubspec version 1.2.0+3 becomes tag 1.2.0-3
          TAG=$(sed -n 's/^version: *//p' pubspec.yaml | tr '+' '-')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists, nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: version
    if: needs.version.outputs.exists == 'false'
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../florin-linux-x64.tar.gz .

      - name: Package Linux .deb
        run: |
          BUNDLE=build/linux/x64/release/bundle
          PKG="$RUNNER_TEMP/deb"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/florin" "$PKG/usr/bin" \
            "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/512x512/apps"
          cp -r "$BUNDLE/." "$PKG/opt/florin/"
          ln -s /opt/florin/florin "$PKG/usr/bin/florin"
          cp linux/florin.desktop "$PKG/usr/share/applications/me.ansarihamedani.florin.desktop"
          cp linux/runner/app_icon.png "$PKG/usr/share/icons/hicolor/512x512/apps/florin.png"

          # dpkg-shlibdeps needs a debian/control in its working directory
          mkdir -p "$RUNNER_TEMP/shlibs/debian"
          touch "$RUNNER_TEMP/shlibs/debian/control"
          # Drop the t64 suffix: t64 packages provide the old names, so the .deb also installs on Ubuntu 22.04 and Debian 12
          DEPENDS=$(cd "$RUNNER_TEMP/shlibs" && dpkg-shlibdeps -O -l"$PKG/opt/florin/lib" \
            "$PKG/opt/florin/florin" "$PKG"/opt/florin/lib/*.so | sed -e 's/^shlibs:Depends=//' -e 's/t64\b//g')

          cat > "$PKG/DEBIAN/control" <<EOF
          Package: florin
          Version: ${{ needs.version.outputs.tag }}
          Architecture: amd64
          Maintainer: Rashad Ansari
          Section: misc
          Priority: optional
          Depends: $DEPENDS
          Description: ZZP bookkeeping for Dutch freelancers
          EOF
          sed -i 's/^ *//' "$PKG/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$PKG" florin-linux-amd64.deb
          dpkg-deb --info florin-linux-amd64.deb

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: florin-linux-x64
          path: |
            florin-linux-x64.tar.gz
            florin-linux-amd64.deb

  build-windows:
    needs: version
    if: needs.version.outputs.exists == 'false'
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Add Visual C++ runtime
        # Flutter apps need these next to the .exe on PCs without the Visual C++ redistributable
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" build\windows\x64\runner\Release\
          }

      - name: Package Windows
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath florin-windows-x64.zip

      - name: Build Windows installer
        env:
          APP_VERSION: ${{ needs.version.outputs.tag }}
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" "/DBuildDir=$PWD\build\windows\x64\runner\Release" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: florin-windows-x64
          path: |
            florin-windows-x64.zip
            florin-windows-x64-setup.exe

  build-macos:
    needs: version
    if: needs.version.outputs.exists == 'false'
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: macos

      - name: Build macOS
        run: flutter build macos --release

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign, notarize and package macOS
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP=build/macos/Build/Products/Release/Florin.app
          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "Developer ID Application: Rashad Ansari (62TDQ32CK7)" "$APP"
          codesign --verify --deep --strict "$APP"

          # ditto keeps the framework symlinks that zip -r would break
          ditto -c -k --keepParent "$APP" notarize.zip
          xcrun notarytool submit notarize.zip --wait --output-format json \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id 62TDQ32CK7 > notary.json
          cat notary.json
          if [ "$(jq -r .status notary.json)" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id notary.json)" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id 62TDQ32CK7
            exit 1
          fi

          xcrun stapler staple "$APP"
          spctl -a -vv "$APP"
          ditto -c -k --keepParent "$APP" florin-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: florin-macos
          path: florin-macos.zip

  release:
    name: Create Release
    needs: [version, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            florin-linux-amd64.deb
            florin-linux-x64.tar.gz
            florin-windows-x64-setup.exe
            florin-windows-x64.zip
            florin-macos.zip
          generate_release_notes: true
          body: |
            ## Installation

            ### macOS

            1. Unzip `florin-macos.zip`
            2. Move `Florin.app` to your Applications folder
            3. Open `Florin.app`

            ### Windows

            1. Download and run `florin-windows-x64-setup.exe`
            2. If Windows SmartScreen appears, click **More info**, then **Run anyway**
            3. Follow the installer. Florin is added to the Start menu.

            For a portable version without installing, unzip `florin-windows-x64.zip` and run `florin.exe`.

            ### Linux

            On Ubuntu, Debian, Linux Mint and other Debian-based systems, download `florin-linux-amd64.deb` and open it to install. Florin then appears in your app menu.

            On other distributions, extract `florin-linux-x64.tar.gz` to a folder and run `./florin`.
