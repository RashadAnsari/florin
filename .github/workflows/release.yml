name: Release

on:
  push:
    tags:
      - '*.*.*-*'

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../florin-linux-x64.tar.gz .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: florin-linux-x64
          path: florin-linux-x64.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath florin-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: florin-windows-x64
          path: florin-windows-x64.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: macos

      - name: Build macOS
        run: flutter build macos --release

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign, notarize and package macOS
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP=build/macos/Build/Products/Release/Florin.app
          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "Developer ID Application: Rashad Ansari (62TDQ32CK7)" "$APP"
          codesign --verify --deep --strict "$APP"

          # ditto keeps the framework symlinks that zip -r would break
          ditto -c -k --keepParent "$APP" notarize.zip
          xcrun notarytool submit notarize.zip --wait --output-format json \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id 62TDQ32CK7 > notary.json
          cat notary.json
          if [ "$(jq -r .status notary.json)" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id notary.json)" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id 62TDQ32CK7
            exit 1
          fi

          xcrun stapler staple "$APP"
          spctl -a -vv "$APP"
          ditto -c -k --keepParent "$APP" florin-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: florin-macos
          path: florin-macos.zip

  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            florin-linux-x64.tar.gz
            florin-windows-x64.zip
            florin-macos.zip
          generate_release_notes: true
          body: |
            ## Installation

            ### macOS

            1. Unzip `florin-macos.zip`
            2. Move `Florin.app` to your Applications folder
            3. Open `Florin.app`

            ### Windows

            1. Unzip `florin-windows-x64.zip`
            2. Run `florin.exe`
            3. If Windows SmartScreen appears, click **More info** then **Run anyway**

            ### Linux

            1. Extract `florin-linux-x64.tar.gz` to a folder, e.g. `~/.local/lib/florin/`
            2. Run `./florin`

            To add Florin to your app launcher:
            ```
            cp data/florin.desktop ~/.local/share/applications/
            ```
            Edit the `Exec=` line in that file to point to the full path of the `florin` binary.
